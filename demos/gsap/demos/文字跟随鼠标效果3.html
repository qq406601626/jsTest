<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Canvas 鼠标文字拖尾效果</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background-color: #0f172a; /* 深色背景效果更好 */
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<canvas id="trailCanvas"></canvas>

<script>
    const canvas = document.getElementById('trailCanvas');
    const ctx = canvas.getContext('2d');

    // 1. 初始化 Canvas 尺寸
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // 2. 配置参数
    const text = "Hello World! 欢迎来到 Canvas 拖尾世界";
    const fontSize = 20;
    const letterSpacing = 16; // 字符之间的间距
    const mouseOffset = 15;   // 第一个字符距离鼠标光标右侧的偏移量
    const followSpeed = 0.18; // 跟随速度 (0-1 之间，越小延迟感越强)

    // 鼠标目标位置
    const mouse = {
        x: canvas.width / 2,
        y: canvas.height / 2
    };

    // 监听鼠标移动
    window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
    });

    // 3. 构建每个字符的初始物理节点
    const chars = text.split('').map((char, index) => ({
        char: char,
        // 初始排列在屏幕中央
        x: canvas.width / 2 + index * letterSpacing,
        y: canvas.height / 2
    }));

    // 4. 动画循环
    function animate() {
        // 清空画布
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 绘制设置
        ctx.font = `bold ${fontSize}px sans-serif`;
        ctx.fillStyle = '#38bdf8'; // 天蓝色文字
        ctx.textBaseline = 'middle';

        // 依次更新和绘制每个字符
        chars.forEach((node, i) => {
            let targetX, targetY;

            if (i === 0) {
                // 第一个字符：紧跟鼠标光标右侧
                targetX = mouse.x + mouseOffset;
                targetY = mouse.y;
            } else {
                // 后续字符：跟随前一个字符，并在 X 轴方向保持水平间距（从左向右排列）
                const prevNode = chars[i - 1];
                targetX = prevNode.x + letterSpacing;
                targetY = prevNode.y;
            }

            // 使用缓动公式 (Lerp) 实现平滑拖尾运动
            node.x += (targetX - node.x) * followSpeed;
            node.y += (targetY - node.y) * followSpeed;

            // 绘制字符
            ctx.fillText(node.char, node.x, node.y);
        });

        requestAnimationFrame(animate);
    }

    // 启动动画
    animate();
</script>

</body>
</html>
