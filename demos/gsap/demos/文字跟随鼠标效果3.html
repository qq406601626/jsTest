<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Canvas 霓虹文字拖尾效果</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background-color: #05050a; /* 近乎全黑的暗色背景，霓虹发光对比度更强 */
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<canvas id="trailCanvas"></canvas>

<script>
    const canvas = document.getElementById('trailCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // 配置参数
    const text = "NEON TRAIL 霓虹彩虹拖尾";
    const fontSize = 24;
    const letterSpacing = 20;
    const mouseOffset = 20;
    const followSpeed = 0.25;

    let hue = 0;

    const mouse = {
        x: canvas.width / 2,
        y: canvas.height / 2
    };

    window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
    });

    const chars = text.split('').map((char, index) => ({
        char: char,
        x: canvas.width / 2 + index * letterSpacing,
        y: canvas.height / 2
    }));

    function animate() {
        // 1. 使用带有微小透明度的黑色覆盖画布，制造运动残影/光轨效果
        ctx.fillStyle = 'rgba(5, 5, 10, 0.25)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.font = `bold ${fontSize}px "Segoe UI", sans-serif`;
        ctx.textBaseline = 'middle';

        hue = (hue + 1.8) % 360;

        chars.forEach((node, i) => {
            let targetX, targetY;

            if (i === 0) {
                targetX = mouse.x + mouseOffset;
                targetY = mouse.y;
            } else {
                const prevNode = chars[i - 1];
                targetX = prevNode.x + letterSpacing;
                targetY = prevNode.y;
            }

            node.x += (targetX - node.x) * followSpeed;
            node.y += (targetY - node.y) * followSpeed;

            const charHue = (hue + i * 10) % 360;
            const color = `hsl(${charHue}, 100%, 65%)`;

            // 2. 核心：开启 Canvas 阴影发光效果
            ctx.shadowColor = color;
            ctx.shadowBlur = 20; // 模糊半径，数值越大发光范围越广

            // 3. 第一次绘制：绘制发光底色（文字本身）
            ctx.fillStyle = color;
            ctx.fillText(node.char, node.x, node.y);

            // 4. 第二次绘制：在中心叠加白色文字，模拟霓虹灯管内部发白的真实质感
            ctx.shadowBlur = 5; // 缩小高光模糊
            ctx.shadowColor = '#ffffff';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(node.char, node.x, node.y);
        });

        requestAnimationFrame(animate);
    }

    animate();
</script>

</body>
</html>
