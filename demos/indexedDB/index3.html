<script>
    const connectDb = () => new Promise((resolve, reject) => {
        const connectionRequest = indexedDB.open('JOZO')
        connectionRequest.onsuccess = (event) => {
            resolve(event.target.result)
        }
        connectionRequest.onerror = reject
        connectionRequest.onupgradeneeded = (event) => {
            const db = event.target.result
            const objectStore = db.createObjectStore("userList", {keyPath: "id"});
            objectStore.createIndex('userId', 'id', {unique: true})
            objectStore.createIndex('userName', 'name', {unique: true})
        }
    })

    const getStoreOperation = (db, storeName) => {
        let r = null
        const dbTransaction = db.transaction(db.objectStoreNames, 'readwrite')
        dbTransaction.oncomplete = () => r && r()
        const dbTransactionStore = dbTransaction.objectStore(storeName)
        dbTransactionStore.do = (cb) => new Promise(resolve => {
            r = resolve
            cb(dbTransactionStore)
        })
        return dbTransactionStore
    }
